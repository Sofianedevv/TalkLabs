services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: talklabs_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html/:rw
      - ./logs/nginx:/var/log/nginx/:rw
    depends_on:
      - php
    networks:
      - networks_talklabs

  php:
    build:
      context: ./docker/php
    container_name: talklabs_php
    volumes:
      - ./:/var/www/html
    depends_on:
      - database
    networks:
      - networks_talklabs
    environment:
      DATABASE_URL: ${DATABASE_URL}

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: talklabs_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test:
        ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      - ./docker/db/data:/var/lib/postgresql/data:rw
    networks:
      - networks_talklabs

volumes:
  database_data:

networks:
  networks_talklabs:
    driver: bridge
