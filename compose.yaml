services:
  nginx:
    build:
      context: ./docker/nginx
    container_name: talkLabs_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html/:rw
      - ./logs/nginx:/var/log/nginx/:rw
    depends_on:
      - php
    networks:
      - networks_talkLabs

  php:
    build:
      context: ./docker/php
    container_name: talkLabs_php
    volumes:
      - ./:/var/www/html
    depends_on:
      - database
    networks:
      - networks_talkLabs
    environment:
       DATABASE_URL: ${DATABASE_URL}
       MERCURE_URL: ${MERCURE_URL}
       MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
       JWT_KEY: ${JWT_KEY}
  
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: talkLabs_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      - ./docker/db/data:/var/lib/postgresql/data:rw
    networks:
      - networks_talkLabs
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    container_name: talkLabs_mercure
    environment:
      SERVER_NAME: 80
      MERCURE_PUBLISHER_JWT: ${MERCURE_PUBLISHER_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT: ${MERCURE_SUBSCRIBER_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: | 
        cors_origin *
      
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "https://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - '8081:80'
      - '443:443'
    volumes:
      - mercure_data:/data
      - mercure_config:/config
      - ./Caddyfile:/etc/caddy/dev.Caddyfile:ro
    networks:
      - networks_talkLabs
      


volumes:
  database_data:
  mercure_data:
  mercure_config:

networks:
  networks_talkLabs:
    driver: bridge