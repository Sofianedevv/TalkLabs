services:
  nginx:
    build:
      context: ./docker/nginx
    container_name: talkLabs_nginx
    ports:
      - "8080:80"
    volumes:
      - vue_build:/usr/share/nginx/html:ro  # Standard nginx
    depends_on:
      - php
      - vuejs
    networks:
      - networks_talkLabs
  php:
    build:
      context: https://github.com/VOTRE-USERNAME/talk-lab-backend.git#main
      dockerfile: docker/php/Dockerfile
    container_name: talklabs_php
    depends_on:
      - postgres
    networks:
      - networks_talkLabs
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      LEXIK_JWT_PASSPHRASE: ${LEXIK_JWT_PASSPHRASE}
      APP_2FA_KEY: ${APP_2FA_KEY}
    restart: unless-stopped
  vuejs:
    build:
      context: https://github.com/LuzBoger/talk-lab-front.git#simulateur
    container_name: talkLabs_vue
    environment:
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - vue_build:/usr/share/nginx/html
    networks:
      - networks_talkLabs
  
  postgres:
    image: postgres:latest
    container_name: talkLabs_postgres_database
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    networks:
      - networks_talkLabs

volumes:
  postgres_data:
  vue_build:

networks:
  networks_talkLabs:
    driver: bridge