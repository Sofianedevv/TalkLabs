services:
  nginx:
    build:
      context: ./docker/nginx
    container_name: talkLabs_nginx
    ports:
      - "80:80"
    volumes:
      - vue_build:/usr/share/nginx/html:ro  # Standard nginx
    depends_on:
      - php
      - vuejs
    networks:
      - networks_talkLabs

  php:
    build:
      context: ./docker/php
    container_name: talkLabs_php
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
    networks:
      - networks_talkLabs
    environment:
       DATABASE_URL: ${DATABASE_URL}

  vuejs:
    build:
      context: https://github.com/LuzBoger/talk-lab-front.git#simulateur
    container_name: talkLabs_vue
    volumes:
      - vue_build:/usr/share/nginx/html # Même chemin
    networks:
      - networks_talkLabs

  
  postgres:
    image: postgres:latest
    container_name: talkLabs_postgres_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    networks:
      - networks_talkLabs
  

volumes:
  postgres_data:
  vue_build:

networks:
  networks_talkLabs:
    driver: bridge