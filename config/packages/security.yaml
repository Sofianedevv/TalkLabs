security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\Accounts:
            algorithm: auto
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Accounts
                property: email
        hwi_oauth.user.provider:
            id: hwi_oauth.user.provider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/(login|register|test|test-token)
            stateless: true
            security: false
        api:
            pattern: ^/api|^/twofactor
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            oauth:
                resource_owners:
                    google: "/login/check-google"
                login_path: /
                use_forward: false
                failure_path: /

                oauth_user_provider:
                    service: hwi_oauth.user.provider
                provider: hwi_oauth.user.provider
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
                path: /
            entry_point: App\Security\LoginFormAuthenticator
            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

            # Easy way to control access for large sections of your site
            # Note: Only the *first* access control that matches will be used
    access_control:
      - { path: ^/api/login, roles: PUBLIC_ACCESS }
      - { path: ^/api/register, roles: PUBLIC_ACCESS }
      - { path: ^/api/categories, roles: PUBLIC_ACCESS }
      - { path: ^/api/get-conversations-public, roles: PUBLIC_ACCESS }
      - { path: ^/api/get-conversations-by-category/*, roles: PUBLIC_ACCESS }
      - { path: ^/api/conversations/by-categories, roles: PUBLIC_ACCESS }
      - { path: ^/api/public-conversations, roles: PUBLIC_ACCESS }
      - { path: ^/api/test, roles: PUBLIC_ACCESS }
      - { path: ^/api/test-token, roles: PUBLIC_ACCESS }
      - { path: ^/twofactor, roles: IS_AUTHENTICATED_FULLY }
      - { path: ^/login/check-google, roles: PUBLIC_ACCESS }
      - { path: ^/api/connect, roles: PUBLIC_ACCESS }
      - { path: ^/api/conversation/like, roles: IS_AUTHENTICATED_FULLY }
      - { path: ^/api/conversation/remove-like, roles: IS_AUTHENTICATED_FULLY }
      - { path: ^/api/conversation/\d+/likes, roles: PUBLIC_ACCESS }
      - { path: ^/api/conversation/\d+/likers, roles: IS_AUTHENTICATED_FULLY }
      - { path: ^/api/connect, roles: PUBLIC_ACCESS }
      - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
      - { path: ^/admin, roles: ROLE_ADMIN }
      - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
