server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;
    root /var/www/html/public;
    index index.php;

    # Configuration pour les routes API Symfony
    location ^~ /api/ {
        try_files $uri /index.php$is_args$args;
    }
    # Configuration pour /twoFactor
    location ^~ /twoFactor {
        try_files $uri /index.php$is_args$args;
    }


    # Traitement de index.php (pour Symfony)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location /uploads/ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
    }

    # Empêcher l'accès direct aux autres fichiers PHP
    location ~ \.php$ {
        return 404;
    }

    # Configuration pour le front Vue.js - EN DERNIER (fallback)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}